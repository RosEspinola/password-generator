<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Password Generator</h1>

    <div class="output">
      <input type="text" id="password" readonly placeholder="Click Generate">
      <button id="copyBtn">Copy</button>
    </div>

    <label>Length: <span id="lengthValue">12</span>
      <input type="range" id="length" min="6" max="32" value="12">
    </label>

    <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
    <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
    <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
    <label><input type="checkbox" id="symbols"> Symbols (!@#$)</label>

    <button id="generateBtn" class="primary">Generate</button>
    <p id="message"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
